name: Build

on:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: Linux
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            output: discogs-random-linux-amd64
          - os: macOS
            runner: macos-latest
            goos: darwin
            goarch: amd64
            output: discogs-random-darwin-amd64
          - os: macOS ARM64
            runner: macos-latest
            goos: darwin
            goarch: arm64
            output: discogs-random-darwin-arm64
          - os: Windows
            runner: windows-latest
            goos: windows
            goarch: amd64
            output: discogs-random-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -v -o ${{ matrix.output }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ matrix.output }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Get Release ID
        id: get_release
        run: |
          RELEASE_ID=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" \
            | jq '.id')
          echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT

      - name: Upload Release Assets
        run: |
          RELEASE_ID=${{ steps.get_release.outputs.release_id }}
          
          for file in linux-amd64/discogs-random-linux-amd64 darwin-amd64/discogs-random-darwin-amd64 darwin-arm64/discogs-random-darwin-arm64 windows-amd64/discogs-random-windows-amd64.exe; do
            filename=$(basename "$file")
            echo "Uploading $filename..."
            
            curl -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$file" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$filename&label=$filename"
          done
